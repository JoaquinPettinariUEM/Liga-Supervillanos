<section class="p-5">
  <h1>Escribir al Superjefe</h1>

  <form [formGroup]="formulario">

    <div class="mb-3">
      <label>Remitente</label>

      <input type="text" class="form-control" formControlName="remitente" />
    </div>

    <div class="mb-3">
      <label>Edad</label>

      <input type="number" class="form-control" formControlName="edad" />
    </div>

    <div class="mb-3">
      <label>Mensaje</label>

      <textarea class="form-control" formControlName="mensaje"></textarea>
    </div>

    <button type="button" class="btn btn-primary" (click)="guardar()">
      Guardar
    </button>

  </form>

  @if (mensajeGuardado) {
  <div class="card mt-4 p-3">
    <h3>Mensaje guardado</h3>

    <p>
      <strong>Remitente:</strong>
      {{ mensajeGuardado.remitente }}
    </p>

    <p>
      <strong>Edad:</strong>
      {{ mensajeGuardado.edad }}
    </p>

    <p>
      <strong>Mensaje:</strong>
      {{ mensajeGuardado.mensaje }}
    </p>
  </div>
  }
</section>
