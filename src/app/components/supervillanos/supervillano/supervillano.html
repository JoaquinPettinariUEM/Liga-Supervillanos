<td>{{ villano.nombre }}</td>

<td class="descripcion">{{ villano.descripcion }}</td>

<td>{{ villano.inteligencia }}</td>

<td>{{ villano.fuerza }}</td>

<td>{{ villano.velocidad }}</td>

<td>{{ villano.durabilidad }}</td>

<td>{{ villano.poder }}</td>

<td>{{ villano.combate }}</td>

<td class="acciones">
  <div class="d-flex gap-2">
    <button class="btn btn-danger" (click)="eliminar()">
      Eliminar
    </button>

    <button class="btn btn-warning" data-bs-toggle="modal"
      [attr.data-bs-target]="'#modal' + villano.id">
      Ver Imagen
    </button>
  </div>
</td>

<div class="modal fade" [id]="'modal' + villano.id" tabindex="-1" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          Imagen del villano
        </h5>
      </div>

      <div class="modal-body text-center">
        <img [src]="villano.imagen" [alt]="villano.nombre" class="img-fluid" />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary"
          data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
